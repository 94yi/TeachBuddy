name: teachbuddy
services:
  app:
    build: .
    image: teachbuddy-web:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TEACHBUDDY_PORT:-8765}:8000"
    environment:
      TEACHBUDDY_ENV: production
      TEACHBUDDY_PASSWORD: ${TEACHBUDDY_PASSWORD:?Set TEACHBUDDY_PASSWORD in .env}
      TEACHBUDDY_SECRET: ${TEACHBUDDY_SECRET:?Set TEACHBUDDY_SECRET in .env}
      TEACHBUDDY_DATA_DIR: /srv/data
      TEACHBUDDY_SECURE_COOKIE: ${TEACHBUDDY_SECURE_COOKIE:-false}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT: ${AI_TIMEOUT:-90}
      AI_FALLBACK_BASE_URL: ${AI_FALLBACK_BASE_URL:-}
      AI_FALLBACK_API_KEY: ${AI_FALLBACK_API_KEY:-}
      AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-}
    volumes:
      - teachbuddy_data:/srv/data
    read_only: true
    tmpfs:
      - /tmp:size=384M,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  teachbuddy_data: